<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор покрытия труб - Россильбер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 20px;
            text-align: right;
            background-color: #ffffff;
        }
        #brand-logo-text {
            color: #003366; /* Синий цвет из вашего логотипа */
            font-weight: bold;
            font-size: 2.5em;
            margin: 0;
            letter-spacing: -1px;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .calculator-container {
            width: 400px;
            padding: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.9em;
            margin-bottom: 5px;
            color: #666;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #003366; /* Соответствует цвету бренда */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #002244;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px dashed #003366;
            text-align: center;
        }
        #resultValue {
            font-size: 1.5em;
            font-weight: bold;
            color: #003366;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #f0f0f0;
            border-top: 1px solid #e0e0e0;
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <p id="brand-logo-text">Россильбер</p>
</header>

<main>
    <div class="calculator-container">
        <h2>Расчет материала для покрытия труб</h2>

        <div class="form-group">
            <label for="coatingType">Тип покрытия</label>
            <select id="coatingType">
                <option value="external">Внешнее покрытие</option>
                <option value="internal">Внутреннее покрытие</option>
            </select>
        </div>

        <div class="form-group">
            <label for="lengthCm">Длина трубы (см)</label>
            <input type="number" id="lengthCm" placeholder="0" step="any">
        </div>

        <div class="form-group">
            <label for="diameterCm">Внешний диаметр трубы (см)</label>
            <input type="number" id="diameterCm" placeholder="0" step="any">
        </div>

        <div class="form-group">
            <label for="wallCm">Толщина стенки трубы (см)</label>
            <input type="number" id="wallCm" placeholder="0" step="any">
        </div>

        <div class="form-group">
            <label for="thicknessMicron">Стандарт нанесения (микроны)</label>
            <input type="number" id="thicknessMicron" placeholder="0" step="any">
        </div>

        <button onclick="calculate()">Рассчитать</button>

        <div class="result-box">
            <label>Необходимый объем продукта:</label>
            <div id="resultValue">0.000 л</div>
        </div>
    </div>
</main>

<footer>
    <p>разработал Патрушев Е.</p>
</footer>

<script>
    function calculate() {
        const type = document.getElementById('coatingType').value;
        const lengthCm = parseFloat(document.getElementById('lengthCm').value);
        const diameterCm = parseFloat(document.getElementById('diameterCm').value);
        const wallCm = parseFloat(document.getElementById('wallCm').value);
        const thicknessMkr = parseFloat(document.getElementById('thicknessMicron').value);

        if (!lengthCm || !diameterCm || !thicknessMkr) {
            alert("Пожалуйста, заполните основные поля");
            return;
        }

        let dCalcCm;
        if (type === 'internal') {
            dCalcCm = diameterCm - (2 * wallCm);
        } else {
            dCalcCm = diameterCm;
        }

        if (dCalcCm <= 0) {
            alert("Ошибка: Внутренний диаметр не может быть меньше или равен нулю");
            return;
        }

        // Перевод в метры
        const lengthM = lengthCm / 100;
        const dCalcM = dCalcCm / 100;

        // Площадь поверхности S = pi * D * L (кв. метры)
        const area = Math.PI * dCalcM * lengthM;

        // Объем V = Площадь * Толщина (в метрах)
        // 1 микрон = 10^-6 метра
        const thicknessM = thicknessMkr / 1000000;
        const volumeM3 = area * thicknessM;

        // Перевод в литры (1 м3 = 1000 литров)
        const liters = volumeM3 * 1000;

        document.getElementById('resultValue').innerText = liters.toFixed(4) + " л";
    }
</script>

</body>
</html>
